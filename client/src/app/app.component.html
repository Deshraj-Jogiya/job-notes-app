<main>
  <h1>Company Research Notes</h1>

  <form (ngSubmit)="addNote()">
    <input type="text" placeholder="Company name" [(ngModel)]="companyName" name="companyName" />
    <textarea placeholder="Note" [(ngModel)]="note" name="note"></textarea>
    <select [(ngModel)]="tag" name="tag">
      <option value="research">Research</option>
      <option value="networking">Networking</option>
      <option value="interview">Interview</option>
      <option value="follow-up">Follow-up</option>
    </select>
    <button type="submit">Add note</button>
  </form>

  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="filters">
    <input
      type="text"
      placeholder="Search notes..."
      [(ngModel)]="searchQuery"
      name="searchQuery"
      (ngModelChange)="onSearchInput()"
    />
    <select [(ngModel)]="tagFilter" name="tagFilter" (ngModelChange)="loadNotes()">
      <option value="">All tags</option>
      <option *ngFor="let t of filterTags" [value]="t">{{ t }}</option>
    </select>
  </div>

  <ul>
    <li *ngFor="let n of notes">
      <strong>{{ n.companyName }}</strong> ({{ n.tag }}): {{ n.note }}
      <button (click)="deleteNote(n._id)">Delete</button>
      <div *ngIf="n.enrichment?.summary" class="enrichment">
        <img *ngIf="n.enrichment?.thumbnailUrl" [src]="n.enrichment?.thumbnailUrl" alt="" />
        <p>{{ n.enrichment?.summary }}</p>
        <a *ngIf="n.enrichment?.url" [href]="n.enrichment?.url" target="_blank" rel="noopener">Wikipedia</a>
      </div>
    </li>
  </ul>
</main>
